[project]
name = "eve-core"
version = "0.1.0"
description = "EVE — assistente pessoal de IA local-first para macOS"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "typer>=0.27",
    "rich>=14",
    "structlog>=25",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "httpx2>=2.12",
    "tomli-w>=1.2.0",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-applicationservices>=12.2.2",
    "keyring>=25.7.0",
    "sqlite-vec>=0.1.9",
    "websockets>=17.1",
    "mcp>=2.1.1",
    "playwright>=1.62.0",
    "tavily-python>=0.8.0",
    "pyyaml>=6.0",
]

[project.scripts]
eve = "eve.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:eve.*"]
markers = ["integration: sobe o daemon de verdade (mais lento)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, I/O bloqueante dentro de corrotina é aceitável e mais legível.
"tests/**" = ["ASYNC240", "ASYNC221", "ASYNC230"]
